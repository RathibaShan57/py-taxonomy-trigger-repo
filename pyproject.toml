[project]
name = "py-taxonomy-trigger"
version = "0.0.1"
description = "Minimal Python repo to trigger Testable whitebox tools and taxonomy metrics"
requires-python = ">=3.12"
dependencies = [
    "requests==2.19.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
